<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameKit Single JS Test</title>
    
    <!-- JS 파일 하나만 로드하면 CSS가 자동으로 로드됨! -->
    <script src="framekit.a5.js"></script>
    
    <style>
        body {
            min-height: 100vh;
            padding: 24px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 24px;
        }
        .info {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FrameKit Single JS Test</h1>
        
        <div class="info">
            <h2>✅ JS 파일 하나만 로드</h2>
            <p>CSS가 자동으로 GitHub CDN에서 로드됩니다!</p>
        </div>
        
        <!-- FrameKit 컴포넌트 테스트 -->
        <h2>컴포넌트 테스트</h2>
        
        <div class="info">
            <h3>Glass Card</h3>
            <div class="fk-card">
                <h4 class="fk-card-title">카드 제목</h4>
                <p class="fk-card-subtitle">부제목</p>
                <p class="fk-card-content">CSS가 자동으로 로드되어 Glass 효과가 적용됩니다.</p>
            </div>
        </div>
        
        <div class="info">
            <h3>Buttons</h3>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="fk-btn fk-btn-primary">Primary Button</button>
                <button class="fk-btn fk-btn-glass">Glass Button</button>
                <button class="fk-btn fk-btn-dark">Dark Button</button>
            </div>
        </div>
        
        <div class="info">
            <h3>Input Field</h3>
            <div>
                <label class="fk-input-label">이메일 주소</label>
                <input type="email" class="fk-input" placeholder="Enter your email">
            </div>
        </div>
        
        <div class="info">
            <h3>Liquid Effect</h3>
            <div class="fk-glass fk-liquid" style="height: 100px; border-radius: 16px;"></div>
        </div>
        
        <div class="info">
            <h3>Modal Test</h3>
            <button class="fk-btn fk-btn-primary" data-fk-modal="test-modal">Open Modal</button>
        </div>
        
        <div class="info">
            <h3>Theme Toggle</h3>
            <button class="fk-btn fk-btn-glass" onclick="FrameKit.theme.toggle()">Toggle Theme</button>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="test-modal" class="fk-modal-overlay">
        <div class="fk-modal">
            <button class="fk-modal-close" aria-label="Close">&times;</button>
            <h2>Modal Title</h2>
            <p>CSS가 자동으로 로드되어 모달도 정상적으로 동작합니다!</p>
        </div>
    </div>
    
    <script>
        // 테스트 완료 메시지
        setTimeout(() => {
            if (typeof FrameKit !== 'undefined') {
                console.log('%c✅ FrameKit loaded successfully!', 'color: #0096ff; font-size: 16px; font-weight: bold;');
                console.log('%c📄 CSS loaded from CDN automatically!', 'color: #4CAF50; font-size: 14px;');
            }
        }, 1000);
    </script>
</body>
</html>
